name: ERP prototype tests (no deployment)
on:
  pull_request:
    paths:
      - 'erp-prototype/**'
      - '.github/workflows/erp-prototype-tests.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test erp-prototype/test/*.test.cjs
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix erp-prototype --ignore-scripts
      - run: erp-prototype/node_modules/.bin/playwright install --with-deps chromium
      - run: node erp-prototype/test/ui-browser.cjs
      - name: Build downloadable offline demo
        run: python3 erp-prototype/build-preview.py "${{ runner.temp }}/erp-demo/THANH_DUC_ERP_DEMO.html"
      - name: Upload offline demo
        uses: actions/upload-artifact@v4
        with:
          name: THANH_DUC_ERP_DEMO
          path: ${{ runner.temp }}/erp-demo/THANH_DUC_ERP_DEMO.html
          if-no-files-found: error
          retention-days: 14
