name: ERP prototype tests (no deployment)
on:
  pull_request:
    paths:
      - 'erp-prototype/**'
      - '.github/workflows/erp-prototype-tests.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test erp-prototype/test/*.test.cjs
