name: Apply Code Patches

on:
  push:
    branches:
      - main
    paths:
      - 'tools/patches/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sale-thanhduc-code-patches
  cancel-in-progress: false

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply changed patch scripts
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run: applying the newest patch only."
            PATCHES="$(find tools/patches -maxdepth 1 -type f -name '*.py' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"

            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE="$(git rev-parse "$AFTER^")"
            fi

            PATCHES="$(git diff --name-only "$BEFORE" "$AFTER" -- 'tools/patches/*.py' || true)"
          fi

          if [ -z "$PATCHES" ]; then
            echo "No changed patch scripts to apply."
            exit 0
          fi

          printf '%s\n' "$PATCHES" | while IFS= read -r patch; do
            [ -z "$patch" ] && continue
            echo "Running $patch"
            python "$patch"
          done

      - name: Validate JavaScript syntax
        run: node --check code.js

      - name: Commit patched source
        shell: bash
        run: |
          if git diff --quiet -- code.js Index.html appsscript.json .clasp.json; then
            echo "No source changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add code.js Index.html appsscript.json .clasp.json
            git commit -m "Apply automated optimization patch"
            git push origin main
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install --global @google/clasp

      - name: Restore clasp credentials
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "Missing GitHub secret: CLASPRC_JSON"
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Push source to Google Apps Script
        run: clasp push --force

      - name: Update existing Web App deployment
        shell: bash
        run: |
          set -euo pipefail

          echo "Current Apps Script deployments:"
          DEPLOYMENTS="$(clasp deployments)"
          printf '%s\n' "$DEPLOYMENTS"

          DEPLOYMENT_ID="$(
            printf '%s\n' "$DEPLOYMENTS" |
            awk '
              /^-/ && $0 !~ /@HEAD/ {
                id = ""
                version = -1
                for (i = 1; i <= NF; i++) {
                  if ($i ~ /^AKfy/) id = $i
                  if ($i ~ /^@[0-9]+$/) {
                    version = substr($i, 2) + 0
                  }
                }
                if (id != "" && version > max_version) {
                  max_version = version
                  best_id = id
                }
              }
              END { print best_id }
            '
          )"

          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "Could not find an existing versioned Apps Script deployment."
            echo "Refusing to create a new URL automatically."
            exit 1
          fi

          echo "Updating deployment: $DEPLOYMENT_ID"
          SHORT_SHA="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          clasp deploy -i "$DEPLOYMENT_ID" -d "Auto deploy $SHORT_SHA"
