name: Deploy Apps Script

on:
  push:
    branches:
      - main
    paths:
      - 'code.js'
      - 'Index.html'
      - 'appsscript.json'
      - '.clasp.json'
  workflow_dispatch:

concurrency:
  group: apps-script-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install --global @google/clasp

      - name: Restore clasp credentials
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "Missing GitHub secret: CLASPRC_JSON"
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Verify Apps Script project
        run: clasp status

      - name: Push source to Google Apps Script
        run: clasp push --force
