name: Deploy Apps Script

on:
  push:
    branches:
      - main
    paths:
      - 'code.js'
      - 'Index.html'
      - 'DonBan.js'
      - 'DonBan.html'
      - '.claspignore'
      - 'appsscript.json'
      - '.clasp.json'
  workflow_dispatch:

concurrency:
  group: apps-script-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install --global @google/clasp

      - name: Restore clasp credentials
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "Missing GitHub secret: CLASPRC_JSON"
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Prepare unique Apps Script filenames
        run: |
          # GAS has one filename namespace across SERVER_JS and HTML.
          # Keep DonBan.js as the reviewed source; deploy its exact bytes as DonBanServer.
          cp DonBan.js DonBanServer.js
          node --check code.js
          node --check DonBanServer.js

      - name: Verify Apps Script project
        run: clasp status

      - name: Push source to Google Apps Script
        run: clasp push --force

      - name: Update existing Web App deployment
        shell: bash
        run: |
          set -euo pipefail

          echo "Current Apps Script deployments:"
          DEPLOYMENTS="$(clasp deployments)"
          printf '%s\n' "$DEPLOYMENTS"

          DEPLOYMENT_ID="$(
            printf '%s\n' "$DEPLOYMENTS" |
            awk '
              /^-/ && $0 !~ /@HEAD/ {
                id = ""
                version = -1
                for (i = 1; i <= NF; i++) {
                  if ($i ~ /^AKfy/) id = $i
                  if ($i ~ /^@[0-9]+$/) {
                    version = substr($i, 2) + 0
                  }
                }
                if (id != "" && version > max_version) {
                  max_version = version
                  best_id = id
                }
              }
              END { print best_id }
            '
          )"

          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "Could not find an existing versioned Apps Script deployment."
            echo "Refusing to create a new URL automatically."
            exit 1
          fi

          echo "Updating deployment: $DEPLOYMENT_ID"
          SHORT_SHA="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          clasp deploy -i "$DEPLOYMENT_ID" -d "Auto deploy $SHORT_SHA"
