<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bảo mật Điều phối</title>
<style>body{font:16px system-ui;max-width:600px;margin:24px auto;padding:16px}button,textarea{font:inherit;padding:12px;min-height:44px}textarea{width:100%;box-sizing:border-box}button{margin:8px 8px 8px 0}#status{white-space:pre-wrap}td,th{text-align:left;padding:8px}</style>
<h1>Khóa kết nối Danh bạ</h1><p>Dán khóa mới từ hộp thoại Danh bạ. Khóa chỉ lưu trong Script Properties; không gửi vào chat hoặc ghi vào sheet.</p><form id="form"><label for="secret">Khóa mới</label><textarea id="secret" required autocomplete="off" spellcheck="false"></textarea><button id="save">Lưu và kiểm tra kết nối</button></form><p id="status" role="status"></p>
<button id="audit">Xem 50 lần đăng nhập sai gần nhất</button><table><thead><tr><th>Thời gian</th><th>Tên đăng nhập</th></tr></thead><tbody id="rows"></tbody></table>
<script>
'use strict';let ticket=__TICKET__;const $=id=>document.getElementById(id),status=text=>$('status').textContent=text;
$('form').onsubmit=ev=>{ev.preventDefault();if(!ticket)return;const value=$('secret').value.trim();if(!/^[a-f0-9]{64,128}$/.test(value)){status('Khóa phải là chuỗi lấy từ hộp thoại Danh bạ.');return;}const once=ticket;ticket=null;$('secret').value='';$('save').disabled=true;status('Đang lưu và kiểm tra…');google.script.run.withSuccessHandler(r=>status(r.ok?'OK — Kết nối Danh bạ thành công. Có thể tắt khóa cũ bên Danh bạ.':'Đã lưu khóa nhưng kiểm tra lỗi: '+r.error+'. Tải lại trang để thử lại; không gửi khóa vào chat.')).withFailureHandler(()=>status('Chưa xác nhận lưu được. Tải lại trang bảo mật và thử lại.')).setDispatchDirectorySecret(once,value);};
window.addEventListener('pagehide',()=>{$('secret').value='';});
$('audit').onclick=()=>google.script.run.withSuccessHandler(rows=>{$('rows').replaceChildren();for(const row of rows.slice().reverse()){const tr=document.createElement('tr');for(const value of [new Date(row.at).toLocaleString('vi-VN',{timeZone:'Asia/Ho_Chi_Minh'}),row.username]){const td=document.createElement('td');td.textContent=value;tr.append(td);}$('rows').append(tr);}}).withFailureHandler(()=>status('Không xem được. Cần quyền chủ hoặc giám đốc.')).viewDispatchFailedLogins();
</script></html>
